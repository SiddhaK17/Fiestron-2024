<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Download</title>
    <script>
        window.onload = function () {
            // Create a hidden link element
            let link = document.createElement('a');
            link.href = 'Scicode.pdf';  // URL of the PDF file (ensure the file is in the same directory or provide a full URL)
            link.download = 'Scicode #25.pdf'; // Suggested filename for download
            document.body.appendChild(link);

            // Automatically trigger the download
            link.click();

            // Remove the link element
            document.body.removeChild(link);
        };
    </script>
</head>

<body>
    <h1>Downloading Scicode #25...</h1>
</body>

</html>
