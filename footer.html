<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer with Glassmorphism & Animation</title>
    <link rel="stylesheet" href="/stylesheets/footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <footer>
        <!-- Quick Links Section -->
        <div class="footer-section">
            <h3 class="footer-title">Quick Links</h3>
            <div class="footer-links">
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
            </div>
        </div>

        <!-- Contact Me Section -->
        <div class="footer-section">
            <h3 class="footer-title">Contact Me</h3>
            <div class="contact-info">
                <p>Email: <a href="mailto:youremail@gmail.com" style="color:#0df205;">youremail@gmail.com</a></p>
                <p>Phone: +123 456 7890</p>
            </div>
        </div>

        <!-- Social Media Handles -->
        <div class="footer-section">
            <h3 class="footer-title">Follow Me</h3>
            <div class="social-icons">
                <a href="#" data-tooltip="GitHub: @username"><i class="fab fa-github"></i></a>
                <a href="#" data-tooltip="Twitter: @username"><i class="fab fa-twitter"></i></a>
                <a href="#" data-tooltip="LinkedIn: @username"><i class="fab fa-linkedin-in"></i></a>
                <a href="#" data-tooltip="Instagram: @username"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script src="/js/footer.js" />
</body>
</html>
