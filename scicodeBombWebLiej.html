<!doctype html>
<html lang="en">

<head>
    <title>Bomb Puzzle</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />

    <style>
        /* Load custom font */
        @font-face {
            font-family: 'DigitFont';
            src: url('./fonts/digit.TTF') format('truetype');
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #333;
            color: white;
            text-align: center;
            font-size: 2rem;
        }

        #timer {
            font-family: 'DigitFont', sans-serif;
            font-size: 5rem;
            color: red;
            position: fixed;
            top: 0;
            margin-top: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            border: #fff 1px solid;
        }

        img {
            width: 60vw;
            padding-top: 50px;
            pointer-events: none;
        }

        .controls {
            display: flex;
            gap: 30px;
        }

        .controls button {
            width: 100px;
            height: 100px;
            font-size: 2.5rem;
            border-radius: 20px;
            border: none;
        }

        .digit-button {
            font-family: 'Digitfont', 'sans-serif';
        }

        .submit-button {
            background-color: #28a745;
            color: white;
            width: 150px;
            height: 150px;
            font-size: 4rem;
            border: none;
            border-radius: 50%;
        }

        .submit-button:hover {
            background-color: #218838;
        }

        .clues {
            margin-top: 60px;
            text-align: left;
            font-size: 1.75rem;
            line-height: 2.5rem;
        }

        h3 {
            font-size: 3rem;
        }
    </style>
</head>

<body>
    <img src="./bombNoLight.png" alt="Bomb" hidden>
    <img src="./bombRed.png" alt="Bomb" hidden>

    <p id="timer">10:00</p>
    <img id="bombImage" src="./bombNoLight.png" alt="Bomb">
    <br>
    <div class="controls">
        <button class="digit-button" onclick="cycleDigit(0)">0</button>
        <button class="digit-button" onclick="cycleDigit(1)">0</button>
        <button class="digit-button" onclick="cycleDigit(2)">0</button>
        <button class="digit-button" onclick="cycleDigit(3)">0</button>
        <button class="submit-button" onclick="checkCode()">✓</button>
    </div>
    <br>
    <div class="clues" id="clueContainer">
        <h3>Brain Teaser Clues:</h3>
        <p>Loading clues...</p>
    </div>
    <audio src="./wrong.mp3" id="wrongAud" preload="auto"></audio>
    <audio src="./defuse.mp3" id="defuseAud" preload="auto"></audio>
    <audio src="./explode.mp3" id="explodeAud" preload="auto"></audio>


    <!-- Bootstrap JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>

    <script>
        let timeRemaining = 900;
        let mistakes = 0;
        let timerInterval;  // Declare the global variable for the timer interval
        let blinking; // Declare blinking variable globally
        const bombImage = document.getElementById("bombImage")

        function updateTimer() {
            let minutes = Math.floor(timeRemaining / 60);
            let seconds = timeRemaining % 60;

            // Format the time with leading zeros if needed
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            // Update the timer display
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;

            // Decrease time remaining by 1 second
            if (timeRemaining > 0) {
                timeRemaining--;
                if (timeRemaining == 9) {
                    var audio = document.getElementById("explodeAud");
                    audio.play();
                }
            } else {
                clearInterval(timerInterval);  // Stop the interval once time is up 
                bombImage.src = "./bombRed.png";  // Show the red bomb when time's up
                clearInterval(blinking);  // Stop blinking the bomb image
            }
        }


        // Array of clue sets
        const clueSets = [
            {
                code: "6824",
                clues: [
                    "Clue 1: Code 2 4 3 9 - Two digits correct but wrongly placed",
                    "Clue 2: Code 6 7 3 4 - Two digits are correct and well placed",
                    "Clue 3: Code 7 9 1 6 - One digit is correct but in wrong position",
                    "Clue 4: Code 3 8 1 7 - One digit right and placed correctly",
                ]
            },
            {
                code:"0249",
                clues: [
                    "Ask the volunteer to play Aud1"
                ]
            },
            {
                code:"3489",
                clues: [
                    "Ask the volunteer to play Aud2"
                ]
            },
            {
                code:"6984",
                clues: [
                    "Ask the volunteer to play Aud3"
                ]
            },
            {
                code:"0931",
                clues: [
                    "Ask the volunteer to play Aud4"
                ]
            }
        ];

        // Select a random clue set
        const selectedSet = clueSets[Math.floor(Math.random() * clueSets.length)];
        const correctCode = selectedSet.code;
        const digits = [0, 0, 0, 0];

        function cycleDigit(index) {
            digits[index] = (digits[index] + 1) % 10;
            document.querySelectorAll(".digit-button")[index].innerText = digits[index];
        }

        function startBlinking() {
            let isRed = false;
            blinking = setInterval(() => {
                bombImage.src = isRed ? "./bombNoLight.png" : "./bombRed.png";
                isRed = !isRed;
            }, 750);
        }

        function stopBlinking() {
            clearInterval(blinking); // Clears the blinking interval
        }

        function checkCode() {
            const inputCode = digits.join("");
            if (inputCode === correctCode) {
                stopBlinking();
                bombImage.src = "./bombGreen.png";
                document.getElementById("timer").style.color = "green"
                var audio = document.getElementById("defuseAud");
                audio.play();
                clearInterval(timerInterval);
            } else {
                var audio = document.getElementById("wrongAud");
                audio.play();
                mistakes += 1;
                if (mistakes > 3) {
                    timeRemaining -= 14;
                }
            }
        }

        // Display the clues on load
        window.onload = () => {
            const clueContainer = document.getElementById("clueContainer");
            clueContainer.innerHTML = "<h3>Brain Teaser Clues:</h3>";
            selectedSet.clues.forEach(clue => {
                clueContainer.innerHTML += `<p>${clue}</p>`;
            });

            startBlinking();

            // Start the timer and update every second
            timerInterval = setInterval(updateTimer, 1000);  // Store the interval in timerInterval variable
        }
    </script>
</body>

</html>
